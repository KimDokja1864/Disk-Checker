<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Смена в «Дисководе»</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=Oswald:wght@500;700&family=PT+Sans:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme: dark;
  --ink:#0c110f; --panel:#141b18; --panel2:#1b2420; --line:#2b3832;
  --lamp:#e9a73c; --cold:#cfe6e0; --muted:#8c9a92;
  --blue:#1f3b66; --red:#b3322c; --green:#6fd08c;
  --paper:#d8d1ba; --paper-ink:#221e16;
  --head:"Oswald","Arial Narrow",Impact,sans-serif;
  --body:"PT Sans","Segoe UI",Arial,sans-serif;
  --mono:"IBM Plex Mono","Courier New",monospace;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0;min-height:100%;background:var(--ink);color:var(--cold);font-family:var(--body);font-size:17px;line-height:1.5}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible{outline:2px solid var(--lamp);outline-offset:2px}
h1,h2,h3{font-family:var(--head);font-weight:700;margin:0;letter-spacing:.01em}
p{margin:0 0 .8em}
#app{max-width:1100px;margin:0 auto;padding:0 14px 28px}

/* generic screens */
.screen{min-height:calc(100vh - 20px);display:flex;flex-direction:column;justify-content:center;gap:18px;padding:22px 0}
.hero{position:relative;border-radius:2px;overflow:hidden;border:1px solid var(--line);background:#000 center/cover no-repeat}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(8,12,10,.25),rgba(8,12,10,.92))}
.hero .in{position:relative;z-index:1;padding:34px 26px 26px;min-height:360px;display:flex;flex-direction:column;justify-content:flex-end;gap:12px}
.hero h1{font-size:clamp(40px,8vw,84px);line-height:.95;color:#fff}
.hero .sub{font-family:var(--head);font-size:20px;color:var(--lamp);font-weight:500}
.btn{background:var(--lamp);color:#1a1205;border:0;padding:12px 22px;font-family:var(--head);font-size:19px;font-weight:700;letter-spacing:.02em;border-radius:2px;align-self:flex-start}
.btn:hover{background:#f4b852}
.btn.ghost{background:transparent;color:var(--cold);border:1px solid var(--line)}
.btn.ghost:hover{border-color:var(--lamp);color:var(--lamp)}
.btn[disabled]{opacity:.35;cursor:not-allowed}
.small{font-size:14px;color:var(--muted)}

/* pager */
.pager{background:#9bb08a;color:#1b2616;font-family:var(--mono);padding:16px 18px;border:3px solid #2a3322;border-radius:6px;box-shadow:inset 0 0 0 2px #7e9370;max-width:640px}
.pager .hd{display:flex;justify-content:space-between;font-weight:600;font-size:13px;margin-bottom:8px;border-bottom:1px solid #5b6d50;padding-bottom:6px}
.pager p{font-size:15px;line-height:1.45}
.rules{background:var(--paper);color:var(--paper-ink);padding:16px 20px;max-width:640px;border-left:8px solid var(--red)}
.rules h3{font-size:22px;margin-bottom:6px}
.rules ul{margin:0;padding-left:20px}
.rules li{margin:5px 0}
.brief{display:grid;grid-template-columns:1fr;gap:16px}
@media(min-width:860px){.brief{grid-template-columns:1fr 1fr;align-items:start}}
.dayhead h2{font-size:clamp(34px,6vw,58px);line-height:1}
.dayhead .date{color:var(--lamp);font-family:var(--head);font-size:19px;font-weight:500}

/* shift */
.hud{display:flex;flex-wrap:wrap;gap:6px 18px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);font-family:var(--head);font-size:17px;font-weight:500}
.hud .clock{font-family:var(--mono);font-size:20px;color:var(--lamp);font-weight:600}
.hud .sp{flex:1}
.hud .bad{color:#ff8a80}
.hud button{background:none;border:1px solid var(--line);padding:3px 12px;font-family:var(--head);font-size:16px}
.hud button:hover{border-color:var(--lamp)}
.stage{display:grid;grid-template-columns:1fr;gap:14px;margin-top:14px}
.desk{display:grid;grid-template-columns:1fr;gap:10px;align-content:start}
@media(min-width:560px){.desk{grid-template-columns:1fr 1fr}.desk .wide{grid-column:1/-1}}
.doc{background:var(--paper);color:var(--paper-ink);padding:10px 14px;font-size:15px;position:relative}
.doc h4{margin:0 0 4px;font-family:var(--head);font-size:15px;font-weight:700;color:#6b5f3e}
.doc.rc{font-family:var(--mono);font-size:13px;background:#e7e3d3}
.doc.rc .ln{display:flex;justify-content:space-between;gap:10px}
.doc.rc .tot{border-top:1px dashed #555;margin-top:4px;padding-top:4px;font-weight:600}
.doc.cam{background:#0b100e;color:var(--green);font-family:var(--mono);border:1px solid #1f3a2a;font-size:14px}
.doc.cam h4{color:#3f8a56}
.doc.note{background:#232c27;color:var(--cold);border-left:4px solid var(--lamp)}
.doc.note h4{color:var(--lamp)}
.doc .insp{background:var(--blue);color:#fff;border:0;padding:6px 12px;font-family:var(--head);font-size:16px;margin-top:4px}
.doc .insp:hover{background:#2a4f87}
.doc ul{margin:0;padding-left:18px}
.acts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.acts button{padding:14px 8px;font-family:var(--head);font-size:20px;font-weight:700;border:0;border-radius:2px}
.acts .pass{background:#2d6a43;color:#fff}.acts .stop{background:#8a5a1c;color:#fff}.acts .rep{background:var(--blue);color:#fff}
.acts button:hover{filter:brightness(1.18)}
.acts button[disabled]{opacity:.35;cursor:not-allowed;filter:none}
.acts small{display:block;font-family:var(--body);font-weight:400;font-size:13px;opacity:.85}
@media(max-width:560px){.acts{grid-template-columns:1fr}}
.verdict{margin-top:14px;background:var(--panel2);border:1px solid var(--line);border-left:6px solid var(--muted);padding:14px 18px;display:grid;gap:10px}
.verdict.ok{border-left-color:var(--green)}.verdict.bad{border-left-color:#ff6b5e}
.verdict b{font-family:var(--head);font-size:20px}

/* evening */
.ledger{background:var(--paper);color:var(--paper-ink);padding:16px 20px;max-width:520px;font-family:var(--mono);font-size:14px}
.ledger .ln{display:flex;justify-content:space-between;padding:2px 0}
.ledger .tot{border-top:2px solid #000;margin-top:6px;padding-top:6px;font-weight:600}
.choice{display:flex;gap:10px;flex-wrap:wrap;margin:6px 0 4px}
.choice button{background:var(--panel2);border:1px solid var(--line);padding:10px 14px;font-family:var(--head);font-size:17px;text-align:left}
.choice button.on{border-color:var(--lamp);background:#2a2415}
.choice button[disabled]{opacity:.35;cursor:not-allowed}
.news{border-left:4px solid var(--blue);padding:4px 14px;color:var(--cold);max-width:640px}
.inc{border-left:4px solid #ff6b5e;padding:4px 14px;max-width:640px}

/* overlay */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:20;display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:20px}
.ov .box{max-width:560px;width:100%}
.ov img{width:100%;display:block}
.ov .x{position:sticky;top:0;float:right;background:var(--lamp);color:#1a1205;border:0;padding:6px 14px;font-family:var(--head);font-size:18px;font-weight:700;margin-bottom:8px}

.end h2{font-size:clamp(34px,7vw,64px);line-height:1}
.end .q{font-style:italic;border-left:3px solid var(--lamp);padding-left:14px;color:var(--cold);max-width:640px}
@media(prefers-reduced-motion:no-preference){.booth svg{animation:hum 5s steps(1) infinite}@keyframes hum{0%,96%{opacity:1}97%{opacity:.86}98%{opacity:1}99%{opacity:.9}}}

.dialog{margin-top:14px;background:var(--panel2);border:1px solid var(--line);border-left:6px solid var(--lamp);padding:14px 18px;display:grid;gap:10px}
.dialog .say{font-size:18px}
.dialog .opts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.dialog .opts button{background:var(--blue);color:#fff;border:0;padding:12px 8px;font-family:var(--head);font-size:17px;font-weight:500;border-radius:2px}
.dialog .opts button:hover{background:#2a4f87}
@media(max-width:560px){.dialog .opts{grid-template-columns:1fr}}
.doc.empty{background:#1b2420;color:var(--muted);border:1px dashed #3a4a43}
.doc.empty h4{color:var(--muted)}
.ask{background:transparent;color:var(--lamp);border:1px solid var(--lamp);padding:6px 12px;font-family:var(--head);font-size:16px;margin-top:2px}
.ask:hover{background:var(--lamp);color:#1a1205}
.art h4{margin:14px 0 4px}
.art input[type=file]{font-size:14px;max-width:100%}
.thumbs{display:flex;flex-wrap:wrap;gap:8px;min-height:30px}
.th{position:relative;width:64px;height:84px;background:#222;border:1px solid #888}
.th img{width:100%;height:100%;object-fit:contain;display:block}
.th button{position:absolute;top:-6px;right:-6px;background:var(--red);color:#fff;border:0;width:20px;height:20px;border-radius:10px;line-height:18px;padding:0;font-size:14px}
.morn{display:grid;gap:8px;max-width:640px}
.morn .strip{height:150px;background:center/cover;border:1px solid var(--line);filter:brightness(.8)}
.morn p{margin:0}
.free{font-family:var(--head);font-size:18px;color:var(--lamp)}

.stage{display:grid;grid-template-columns:1fr;gap:14px;margin-top:14px}
@media(min-width:900px){.stage{grid-template-columns:minmax(300px,.9fr) 1.1fr}}
.booth{position:relative;aspect-ratio:var(--ar,.8);max-height:80vh;width:100%;border:1px solid var(--line);background:#000;overflow:hidden}
.booth .bgimg{position:absolute;inset:0;background:center/cover;filter:brightness(.55) saturate(.9);transform:scale(1.04)}
.booth .bgimg.custom{filter:none;transform:none}
.booth .chars{position:absolute;inset:0;transform:translateY(calc(var(--cy,0)*1%)) scale(var(--cs,1));transform-origin:50% 100%}
.booth .chars svg{width:100%;height:100%;display:block}
.booth .fg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;pointer-events:none}
.booth .fgdesk{position:absolute;left:0;right:0;bottom:0;height:14%;background:linear-gradient(#5a4731 0 5px,#33281c 5px 100%);border-top:2px solid #8a7452;box-shadow:0 -12px 26px rgba(0,0,0,.55)}
.booth .dshade{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;mix-blend-mode:multiply}
.booth .scan{position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(0,0,0,.16) 0 1px,transparent 1px 3px);pointer-events:none}
.plate{position:absolute;left:0;right:0;top:0;background:rgba(8,12,10,.82);padding:6px 14px;font-family:var(--head);font-size:19px;display:flex;justify-content:space-between;gap:10px}
.plate .q{color:var(--muted);font-size:15px;align-self:center;font-weight:500}
.ov .box.wide{max-width:820px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.tabs button{background:var(--panel2);border:1px solid var(--line);padding:6px 14px;font-family:var(--head);font-size:17px}
.tabs button.on{background:var(--lamp);color:#1a1205;border-color:var(--lamp)}
.ws{background:var(--paper);color:var(--paper-ink);padding:16px 20px}
.ws h3{font-size:24px;margin-bottom:6px}.ws h4{margin:14px 0 4px;font-family:var(--head);font-size:17px}
.ws input[type=file]{font-size:14px;max-width:100%}
.ws textarea,.ws select{width:100%;font:inherit;font-size:15px;padding:6px 8px;background:#f1edde;color:#221e16;border:1px solid #8a7e5e}
.ws textarea{min-height:90px;font-family:var(--mono);font-size:13px}
.ws .row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ws label{display:block;font-size:14px;margin-top:6px}
.ws input[type=range]{width:100%}
.ws .scn{border:1px solid #8a7e5e;padding:8px 10px;margin:8px 0;background:#e7e3d3}
.ws .mini{background:var(--blue);color:#fff;border:0;padding:5px 12px;font-family:var(--head);font-size:15px;margin:4px 6px 0 0}
.ws .mini.red{background:var(--red)}
.ws .prev{max-width:300px;margin:8px 0}

/* визуальная новелла: сцены в конце смены */
.vn{position:relative;aspect-ratio:16/9;max-height:84vh;width:100%;overflow:hidden;border:1px solid var(--line);background:#000 center/cover no-repeat;cursor:pointer;user-select:none;-webkit-user-select:none}
.vn::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.12) 40%,rgba(0,0,0,.55));pointer-events:none}
.vn .sl{position:absolute;bottom:0;height:90%;display:flex;align-items:flex-end;justify-content:center;transition:filter .25s,opacity .25s;pointer-events:none}
.vn .sl.l{left:3%}.vn .sl.r{right:3%}
.vn .sl img{height:100%;width:auto;max-width:46vw;object-fit:contain;display:block;filter:drop-shadow(0 6px 14px rgba(0,0,0,.6))}
.vn .sl.dim{filter:brightness(.45) saturate(.65)}
.vn .sl.off{opacity:0}
.vn .ph{height:100%;aspect-ratio:3/5;display:flex;align-items:flex-start;justify-content:center;padding-top:22%;box-sizing:border-box;font-family:var(--head);font-size:clamp(40px,9vw,110px);font-weight:700;color:rgba(255,255,255,.55);background:linear-gradient(180deg,rgba(40,52,46,.0),rgba(40,52,46,.85)),radial-gradient(ellipse 38% 22% at 50% 30%,#56655d 0 60%,transparent 62%),radial-gradient(ellipse 60% 55% at 50% 100%,#3d4a43 0 60%,transparent 62%)}
.vn .box{position:absolute;left:3%;right:3%;bottom:4%;min-height:24%;background:rgba(10,14,12,.88);border:1px solid var(--line);border-left:6px solid var(--lamp);padding:28px 26px 22px;box-sizing:border-box}
.vn .nm{position:absolute;top:-17px;left:18px;background:var(--lamp);color:#1a1205;font-family:var(--head);font-weight:700;font-size:20px;padding:2px 16px;letter-spacing:.02em}
.vn .vt{font-size:clamp(16px,2.3vw,23px);line-height:1.5}
.vn .vt.narr{font-style:italic;color:var(--cold)}
.vn .nx{position:absolute;right:16px;bottom:7px;color:var(--lamp);font-family:var(--head);font-size:15px;animation:vnb 1s steps(2) infinite}
@keyframes vnb{50%{opacity:.2}}
.vnhint{color:var(--muted);font-size:14px;text-align:center}
.scene{background:var(--panel2);border-left:6px solid var(--lamp);padding:22px 26px;max-width:680px;display:grid;gap:10px}
.scene .who{font-family:var(--head);font-size:24px;color:var(--lamp)}
.scene .txt{font-size:20px;line-height:1.5}
.doc.bill{background:#cfd8c0;color:#1d2a18;border:2px solid #5d7050;font-size:14px}
.doc.bill h4{color:#3d5230}
.pd{font-size:14px;line-height:1.35}
.pd b{font-family:var(--head);font-size:17px;letter-spacing:.03em}
.doc.pdoc{background:#e4dcc0}
.gate{color:#ffb07a;font-size:15px;margin-top:10px}
.memo h4{margin:14px 0 4px;font-family:var(--head);font-size:18px}
.memo ul{margin:0;padding-left:20px}
.memo li{margin:3px 0}
.lock{opacity:.5}
</style>
</head>
<body>
<div id="app"></div>
<script src="assets.js"></script>
<script src="dialogs.js"></script>
<script>
const A=window.ASSETS||{};
const enc=p=>p?encodeURI(p):p;
const IMG={ROOM:enc((A.ui||{}).room),FOOD:enc((A.ui||{}).food),POSTER:enc((A.ui||{}).poster),STREET:enc((A.ui||{}).street),MEMORIAL:enc((A.ui||{}).memorial)};
const $=s=>document.querySelector(s), app=$('#app');
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* =====================================================
   НАСТРОЙКИ ИГРЫ (дни считаются с 1; массивы идут по дням 1–5)
   ===================================================== */
const CONFIG={
  unlock:{cam:2,doc:3,money:4},      // с какого дня доступно
  mandatory:{doc:3,money:4},         // с какого дня без этого нельзя решать
  bigCheck:1000,                     // чек больше этой суммы: проверять деньги
  freeErrors:[2,2,1,1,0],            // бесплатные нарушения по дням
  penalty:[3,5,8,12,18],             // штраф за каждое лишнее нарушение, руб.
  incident:[0,10,15,20,25],          // снятая премия, если пропущен Абсолют
  wage:[50,50,55,55,60],
  warnOver:[99,99,99,3,2],           // сколько лишних нарушений даёт выговор (−1 доверие)
  rent:25,
  clockStep:12                       // минут на каждого посетителя
};

/* ---------- настройки из assets.js ---------- */
const DB={init(){return Promise.resolve()},get(k){try{return Promise.resolve(JSON.parse(localStorage.getItem('dk_'+k)))}catch(e){return Promise.resolve(null)}},set(k,v){try{localStorage.setItem('dk_'+k,JSON.stringify(v));return Promise.resolve(true)}catch(e){return Promise.resolve(false)}}};
const ART={bg:enc(A.background)||null,view:enc(A.desk)||null,viewRatio:A.deskRatio||0,charScale:A.charScale||100,charY:A.charY||0,pShadows:2};
const NPCS=(A.npcs||[]).filter(n=>n&&n.file&&(n.gender==='m'||n.gender==='f')&&typeof n.age==='number');
const SKIPPED=(A.npcs||[]).length-NPCS.length;
let ANTON=A.anton&&A.anton.file?A.anton:null;
let SOUNDS={};Object.entries(A.sounds||{}).forEach(([k,v])=>{if(v)SOUNDS[k]=enc(v)});
let PROBLEMS=[];
const DEFAULT_DIALOGS=[
 {day:1,cond:'always',text:"Администратор: Ну что, первый день. Без кражи, считай, повезло.\nНикита: Я даже не успел понять, где у вас что лежит.\nАдминистратор: Поймёшь. Тут все в конце концов понимают."},
 {day:2,cond:'caught',text:"Орлова: Вижу отметку. Неплохо.\nНикита: Он даже не сопротивлялся.\nОрлова: Они не сопротивляются. Они идут по маршруту."},
 {day:2,cond:'missed',text:"Орлова: В 19:12 у стенда был инцидент.\nНикита: Я не успел.\nОрлова: Не успел или не заметил?"},
 {day:0,cond:'innocent',text:"Орлова: Чисто. Бывает.\nНикита: Бывает?\nОрлова: Спокойной ночи, Никита."},
 {day:0,cond:'anton_stop',text:"Антон: Мне он не нужен.\nНикита: Тогда зачем брал?\nАнтон: Хотелось, чтобы хоть что-то хотелось."},
 {day:0,cond:'anton_pass',text:"Никита: Я его отпустил.\nНикита: Зачем я его отпустил?"}
];
let DIALOGS=(window.DIALOGS_DATA||DEFAULT_DIALOGS).map(x=>({...x}));
const CONDS=[['always','Всегда'],['caught','Поймал Абсолюта'],['missed','Пропустил Абсолюта'],['errors','Были штрафы'],['noerr','Ни одного нарушения'],['innocent','Сдал невиновного'],['anton_stop','Остановил Антона'],['anton_pass','Пропустил Антона']];
const SND_SLOTS=[['click','Клик кнопки'],['paper','Документ, чек'],['zip','Сумка'],['stamp','Печать, «Остановить»'],['ding','Верно, касса'],['buzz','Ошибка'],['ok','Спор разрешён'],['pager','Пейджер'],['door','Новый посетитель'],['blip','Камера'],['ambient','Фон: торговый центр (зацикленный)']];

/* ---------- звук ---------- */
const Snd=(()=>{
 let ctx=null,master=null,muted=false,custom={},amb=null,ambKind='off';
 function init(){if(ctx)return true;try{const AC=window.AudioContext||window.webkitAudioContext;ctx=new AC();master=ctx.createGain();master.gain.value=.55;master.connect(ctx.destination);return true}catch(e){ctx=null;return false}}
 function osc(f,d,type,v,t0,f2){const t=ctx.currentTime+(t0||0);const o=ctx.createOscillator(),g=ctx.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(master);o.start(t);o.stop(t+d+.03)}
 function noise(d,v,hp,lp,t0){const t=ctx.currentTime+(t0||0);const n=Math.max(1,Math.floor(ctx.sampleRate*d));const b=ctx.createBuffer(1,n,ctx.sampleRate);const a=b.getChannelData(0);for(let i=0;i<n;i++)a[i]=Math.random()*2-1;const s=ctx.createBufferSource();s.buffer=b;const f1=ctx.createBiquadFilter();f1.type='highpass';f1.frequency.value=hp||200;const f2=ctx.createBiquadFilter();f2.type='lowpass';f2.frequency.value=lp||6000;const g=ctx.createGain();g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);s.connect(f1);f1.connect(f2);f2.connect(g);g.connect(master);s.start(t)}

  o1.connect(og);o2.connect(og);og.connect(master);o1.start();o2.start();

function mkDoc(r,c,fake,age){
  let type;
  if(age<14)type='Школьный дневник';
  else if(age<18)type=pickR(r,['Паспорт','Школьный дневник']);
  else type=(age<=26&&r()<.3)?'Студенческий билет':'Паспорт';
  if(fake)type=(c.role==='forger'&&age<=26&&r()<.5)?'Студенческий билет':'Паспорт';
  const by=2004-age,bm=1+Math.floor(r()*11),bd=1+Math.floor(r()*27);
  const d={type,name:c.name,by,bm,bd,age,defects:[],stamp:type==='Паспорт'?'ГУВД Санкт-Петербурга, оттиск чёткий':'печать деканата, оттиск чёткий',
    title:type==='Паспорт'?'ПАСПОРТ РФ':type==='Студенческий билет'?'СТУДЕНЧЕСКИЙ БИЛЕТ':'ДНЕВНИК',
    school:'Школа № '+(100+Math.floor(r()*400)),cls:(5+Math.floor(r()*6))+pickR(r,['А','Б','В']),
    num:'40 0'+(1+Math.floor(r()*4))+' № '+(100000+Math.floor(r()*899999)),until:'06.2005',im:1+Math.floor(r()*11),id:1+Math.floor(r()*27),iy:0};
  if(type==='Паспорт'){let iy=by+14;if(age>=20&&r()<.4)iy=Math.min(2004,by+20);d.iy=iy}
  if(fake){
    const pool=type==='Паспорт'?['issued','stamp','typo']:['expired','stamp','typo'];
    const n=1+(r()<.4?1:0);d.defects=shuffle(r,pool).slice(0,n);
    if(d.defects.includes('issued'))d.iy=by+8+Math.floor(r()*4);
    if(d.defects.includes('stamp'))d.stamp='оттиск смазан, прочесть нельзя';
    if(d.defects.includes('typo'))d.title=type==='Паспорт'?'ПАСПОРГ РФ':'СТУДЕНЧЕКИЙ БИЛЕТ';
    if(d.defects.includes('expired'))d.until='06.2003';
  }
  return d;
}
function docHTML(d){
  const bdate=`${p2(d.bd)}.${p2(d.bm)}.${d.by}`;
  if(d.type==='Школьный дневник')return `<div class="pd"><b>${d.title}</b><div>Ученик: ${esc(d.name)}</div><div>${d.school}, ${d.cls} класс</div><div>Год рождения: ${d.by}</div><div>Возраст: <b>${d.age}</b></div><div>Печать: школа, оттиск чёткий</div></div>`;

  return `<div class="pd"><b>${d.title}</b><div>${esc(d.name)}</div><div>Дата рождения: ${bdate}</div><div>Возраст: <b>${d.age}</b></div><div>Выдан: ${p2(d.id)}.${p2(d.im)}.${d.iy}</div><div>Серия, номер: ${d.num}</div><div>Печать: ${d.stamp}</div></div>`;
}

    if(b.defects.includes('serial'))b.bottom=b.top.slice(0,-2)+String(10+Math.floor(r()*80));
    if(b.defects.includes('wm'))b.wm='на просвет не виден';
    if(b.defects.includes('thread'))b.thread='нарисована, не прощупывается';
    if(b.defects.includes('ink'))b.ink='цвет блёклый, пачкает пальцы';
  }
  return b;
}
function bigBasket(r,lim){for(let k=0;k<40;k++){const a=shuffle(r,ITEMS.filter(i=>i.r<=lim)).slice(0,3);if(a.reduce((x,i)=>x+i.p,0)>CONFIG.bigCheck)return a}return ITEMS.slice(0,3)}

/* ---------- посетители ---------- */
function pickNpc(r,role,day,used){
  let lo=18,hi=99;
  if(role==='underage'){lo=12;hi=17}
  else if(role==='normal'){lo=12}
  else if(role==='abs'){[lo,hi]=ABS_CFG[day].range}
  const ok=n=>(!n.only||n.only.includes(role));
  let pool=NPCS.filter(n=>n.age>=lo&&n.age<=hi&&ok(n));
  if(!pool.length&&role==='abs')pool=NPCS.filter(n=>n.age>=18&&ok(n));
  const fresh=pool.filter(n=>!used.has(n.file));
  const src=fresh.length?fresh:pool;
  if(!src.length)return null;
  const n=pickR(r,src);used.add(n.file);return n;
}
function mk(r,day,role,used){
  const npc=role==='anton'?ANTON:pickNpc(r,role,day,used||new Set());
  let female=r()<.42;
  let age=18+Math.floor(r()*36);
  if(role==='underage')age=12+Math.floor(r()*6);
  if(role==='abs')age=ABS_CFG[day].age;
  if(role==='anton')age=24;
  if(npc){female=role==='anton'?false:npc.gender==='f';age=typeof npc.age==='number'?npc.age:age}
  const c={role,female,age,
    name:role==='anton'?"Антон Авдеев":(npc&&npc.name)?npc.name:(female?pickR(r,FN_F)+" "+pickR(r,SN)[1]:pickR(r,FN_M)+" "+pickR(r,SN)[0]),
    coat:pickR(r,COATS),hair:pickR(r,HAIRS),skin:pickR(r,SKINS),
    hat:r()<.4,hatc:pickR(r,["#2a3a50","#6b2f2f","#3c3c3c","#4a5a3a"]),scarf:r()<.55,scarfc:pickR(r,["#a33","#348","#c93","#888"]),
    shadows:2,items:[],bag:[],note:pickR(r,NOTES),eo:10+Math.floor(r()*5),ro:3+Math.floor(r()*5),
    timeBad:false,violation:null,sprite:null,total:0,doc:null,bill:null,
    shown:{rc:false,cam:false},st:{doc:'closed',bag:'closed'},wr:{doc:0,bag:0},tp:{doc:'calm',bag:'calm'},tl:{doc:0,bag:0},
    ol:{doc:'',bag:''},dk:null,react:'',moneyChecked:false,
    calmBag:pickR(r,CALM_BAG),calmDoc:pickR(r,CALM_DOC)};
  if(npc)c.sprite=enc(npc.file);
  const plain=(role==='abs'||role==='anton');
  const aBag=role==='thief'?.6:plain?0:.35;
  const aDoc=(role==='forger'||role==='underage')?.55:plain?0:.3;
  if(r()<aBag){c.tp.bag=pickR(r,['proud','aggr','nerv']);c.tl.bag=Math.floor(r()*2)}
  if(r()<aDoc){c.tp.doc=pickR(r,['proud','aggr','nerv']);c.tl.doc=Math.floor(r()*2)}
  const lim=age>=18?18:(age>=16?16:12);
  const okItems=ITEMS.filter(i=>i.r<=lim);
  const base=()=>{const n=1+Math.floor(r()*2);return shuffle(r,okItems).slice(0,n)};
  let fakeDoc=false,shownAge=age,fakeBill=false;
  switch(role){
   case'normal':c.items=(day>=CONFIG.unlock.money&&r()<.3)?bigBasket(r,lim):base();break;
   case'thief':{c.items=base();const extra=shuffle(r,ITEMS.filter(i=>!c.items.includes(i)&&i.r<=lim))[0];c.bag=c.items.concat([extra]);c.violation='theft';c.note="Рюкзак тяжелее, чем должен быть. "+c.note;break}
   case'underage':c.items=[pickR(r,R18)].concat(r()<.5?base().slice(0,1):[]);c.violation='underage';
     if(age>=14&&r()<.45){fakeDoc=true;shownAge=18+Math.floor(r()*9)}break;
   case'forger':c.items=base();c.violation='forged';fakeDoc=true;c.note="Нервно поправляет воротник. "+c.note;break;
   case'counterfeit':c.items=bigBasket(r,18);c.violation='counterfeit';fakeBill=true;break;
   case'abs':{const a=ABS_CFG[day];c.items=a.series?SERIES_ABS[day].slice():base();
     c.shadows=0;if(a.time)c.timeBad=true;if(a.noscan)c.note=NOSCAN;
     c.calmBag="Молча кладёт сумку на стойку и открывает. Не задаёт вопросов, не смотрит на тебя.";
     c.calmDoc="Молча протягивает документ. Рука двигается ровно, как по рельсам.";break}
   case'decoyShadow':c.items=base();c.shadows=1;c.note="Стоит у колонны, вторая лампа перекрыта. Долго выбирает диски, сравнивает цены.";break;
   case'decoySeries':c.items=SERIES_FAN.slice();c.note="Обсуждает с другом сюжет и спорит, какая часть лучше. Читает ценники.";break;
   case'decoyTime':c.items=base();c.timeBad=true;c.note="Чек из соседнего отдела сети: пробил там, пока вы не видели, и вернулся за сдачей. Нервничает.";break;
   case'decoyNoscan':c.items=base();c.note=NOSCAN+" На груди бейдж «Электроника, склад».";break;
   case'anton':c.items=[];c.bag=[HL2,{t:"Шаурма куриная в лаваше"}];c.violation='theft';
     c.note="Ничего не выбирает. Простоял двадцать минут у коробок Half-Life 2. Одна рука в кармане куртки. «Мне всё равно, я просто посмотреть».";
     c.calmBag="Пожимает плечами и открывает куртку. Спорить ему не хочется.";c.calmDoc="Протягивает паспорт, не глядя. «Берите».";break;
  }
  if(!c.bag.length&&role!=='anton')c.bag=c.items.slice();
  c.total=c.items.reduce((a,i)=>a+i.p,0);
  c.docFake=fakeDoc;
  c.doc=mkDoc(r,c,fakeDoc,shownAge);
  if(c.total>CONFIG.bigCheck)c.bill=mkBill(r,fakeBill);
  const ls=age>=18?3:1;c.look=Math.max(8,age+Math.floor(r()*(2*ls+1))-ls);
  if(npc)c.look=(typeof npc.look==='number')?npc.look:(typeof npc.age==='number'?npc.age:age);
  else if(fakeDoc&&role==='underage')c.look=age;
  return c;
}
function buildQueue(day){
  const d=DAYS[day-1],r=rng(S.seed+day*7919);
  const plan=d.plan.slice();
  if(day>=2&&r()<.7)plan.push('anton');
  let q=shuffle(r,plan);
  if(day>1){const i=q.indexOf('abs');if(i<2){const j=2+Math.floor(r()*(q.length-2));[q[i],q[j]]=[q[j],q[i]]}}
  const used=new Set();
  return q.map(role=>mk(r,day,role,used));
}

  if(S.morn)morn=`<div class="morn">${S.morn.img?`<div class="strip" style="background-image:url(${S.morn.img})"></div>`:''}${S.morn.lines.map(l=>`<p>${l}</p>`).join('')}<div class="free">Бесплатных нарушений сегодня: ${S.free}</div></div>`;
  app.innerHTML=`<div class="screen">
   <div class="dayhead"><div class="date">${d.date}</div><h2>${d.title}</h2></div>
   ${morn}
   <div class="brief">
    <div class="pager"><div class="hd"><span>ПЕЙДЖЕР ВОЗР</span><span>05:52</span></div>${d.pager.map(p=>`<p>${p}</p>`).join('')}<p>— О.</p></div>
    <div class="rules"><h3>Правила на смену</h3><ul>${d.rules.map(x=>`<li>${x}</li>`).join('')}</ul><p class="small" style="color:#6b5f3e;margin-top:8px">Штраф за лишнее нарушение сегодня: ${CONFIG.penalty[n-1]} р.</p></div>
   </div>
   <div style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn" id="go">Выйти на смену</button><button class="btn ghost" id="memo">Памятка</button><button class="btn ghost" id="poster">Плакат ВОЗР</button></div>
  </div>`;
  $('#go').onclick=()=>startShift(n);
  $('#memo').onclick=()=>overlay(memoHTML(n));
  $('#poster').onclick=()=>overlay(`<img src="${IMG.POSTER}" alt="Плакат ВОЗР: как правильно обращаться с абсолютами">`);
}
function startShift(n){
  sh={day:n,q:buildQueue(n),i:0,clock:900,charges:n>=2?2:0,errors:0,free:S.free,absMissed:false,absCaught:false,decided:false,innocentToday:false,antonStop:false,antonPass:false};
  Snd.ambient('mall');
  nextCustomer();
}
function hud(){
  const over=sh.errors>sh.free;
  return `<div class="hud"><span>${DAYS[sh.day-1].title.split(' · ')[0]}</span><span class="clock">${fmt(sh.clock)}</span>
  <span>Пейджер: ${sh.day>=2?sh.charges:'—'}</span><span class="${over?'bad':''}">Нарушения: ${sh.errors} (бесплатно ${sh.free}, потом ${CONFIG.penalty[sh.day-1]} р.)</span><span>${S.money} р.</span><span class="sp"></span>
  <button id="memo">Правила</button><button id="memo2">Памятка</button><button id="mu">Звук: ${Snd.muted?'выкл':'вкл'}</button></div>`;
}
function nextCustomer(){
  if(sh.i>=sh.q.length||sh.clock>=1200){
    for(let j=sh.i;j<sh.q.length;j++)if(sh.q[j].role==='abs')sh.absMissed=true;
    return endShift(sh.i<sh.q.length);
  }
  sh.cur=sh.q[sh.i];sh.decided=false;sh.clock+=CONFIG.clockStep;
  const c=sh.cur;c.entry=sh.clock-c.eo;c.rt=c.timeBad?c.entry-(2+c.ro%4):c.entry+c.ro;
  Snd.play('door');draw();
}
const needMoney=c=>sh.day>=CONFIG.unlock.money&&c.total>CONFIG.bigCheck;
function gate(c){
  if(sh.day>=CONFIG.mandatory.doc&&!(c.st.doc==='open'||c.st.doc==='refused'))return 'Начальство ввело правило: сначала документ.';
  if(sh.day>=CONFIG.mandatory.money){
    if(!c.shown.rc)return 'Сначала чек: нужно знать сумму.';
    if(needMoney(c)&&!c.moneyChecked)return 'Покупка больше 1000 р.: сначала проверь купюру.';
  }
  return '';
}
function ask(k){const c=sh.cur;if(c.shown[k])return;c.shown[k]=true;sh.clock+=1;Snd.play(k==='cam'?'blip':'paper');draw()}
function checkMoney(){const c=sh.cur;if(c.moneyChecked)return;c.moneyChecked=true;sh.clock+=2;Snd.play('paper');draw()}
function askItem(kind){
  const c=sh.cur;sh.clock+=kind==='doc'?1:3;
  if(c.tp[kind]==='calm'){c.st[kind]='open';c.ol[kind]=kind==='doc'?c.calmDoc:c.calmBag;Snd.play(kind==='doc'?'paper':'zip')}
  else{c.st[kind]='dialog';c.dk=kind}
  draw();
}
function approach(k){
  const c=sh.cur,kind=c.dk,T=TEMPER[c.tp[kind]];
  if(T.right===k){c.st[kind]='open';c.ol[kind]=T[kind].ok;sh.clock+=1;Snd.play('ok')}
  else{c.wr[kind]++;sh.clock+=3;c.react=T.wrong[c.wr[kind]-1]||T.wrong[0];Snd.play('buzz');
    if(c.wr[kind]>=2){c.st[kind]='refused';sh.errors++;S.errTotal=(S.errTotal||0)+1}}
  draw();
}
function draw(){
  const c=sh.cur,now=sh.clock,U=CONFIG.unlock;
  const btn=(attrs,t,min)=>`<button class="ask" ${attrs}>${t} · ${min} мин</button>`;
  let cards='';
  if(sh.day>=U.doc){
    const s=c.st.doc;
    cards+=s==='open'?`<div class="doc pdoc"><h4>Документ</h4><div class="small" style="color:#6b5f3e">${c.ol.doc}</div>${docHTML(c.doc)}</div>`
      :s==='dialog'?`<div class="doc"><h4>Документ</h4><div>Идёт разговор.</div></div>`
      :s==='refused'?`<div class="doc"><h4>Документ</h4><div>Отказался показывать. Администратор записал жалобу.</div></div>`
      :`<div class="doc empty"><h4>Документ${sh.day>=CONFIG.mandatory.doc?' (обязательно)':''}</h4>${btn('data-doc="1"','Попросить документ',1)}</div>`;
  }

const VMSG={
 theft:{pass:"Через минуту кассир ловит недостачу: в сумке лежало то, чего нет в чеке. Администратор смотрит на тебя.",stop:"Администратор находит лишний диск. Покупатель мнётся, платит. Магазин доволен."},
 underage:{pass:"Школьник уходит с игрой 18+. Через час звонит чья-то мама.",stop:"Продавец отбирает игру. Школьник уходит, бурча: «Это брат сказал, что можно»."},
 forged:{pass:"Ты возвращаешь поддельный документ владельцу и пропускаешь его. К вечеру выясняется: бланк краденый, и милиция уже спрашивает про тебя.",stop:"Ты называешь администратору дефект. Тот вызывает милицию, а человек пытается уйти через склад."},
 counterfeit:{pass:"Кассир найдёт фальшивую купюру только вечером, когда не сойдётся касса. Недостачу вычтут из зарплаты охраны.",stop:"Администратор смотрит купюру на просвет и кивает. Покупателя просят пройти в кабинет. Он бледнеет."}
};
function decide(a){
  if(sh.decided)return;sh.decided=true;
  const c=sh.cur;let ok=true,txt='',neutral=false;
  const err=t=>{ok=false;sh.errors++;S.errTotal=(S.errTotal||0)+1;txt=t};
  const A=c.role==='anton',V=c.violation&&VMSG[c.violation];
  if(a==='pass'){
    if(A){S.antonPassed++;sh.antonPass=true;err("Антон уходит, и куртка у него топорщится. Через час на полке стоит пустая коробка Half-Life 2, а на кафеле рядом капля соуса.")}
    else if(V)err(V.pass);
    else if(c.role==='abs'){sh.absMissed=true;neutral=true;txt="Он проходит мимо. Ровно, без остановок. Ты не оборачиваешься."}
    else txt="Проходит. Дверь хлопает, пахнет мокрой шерстью.";
  }else if(a==='stop'){
    if(A){S.antonStopped++;sh.antonStop=true;txt="Антон молча достаёт Half-Life 2 из куртки и кладёт на стойку. «Мне он не нужен. Просто хотелось, чтобы хоть что-то хотелось». Он уходит доедать шаурму."}
    else if(V)txt=V.stop;
    else if(c.role==='abs'){sh.absMissed=true;err("Ты останавливаешь его. Он смотрит на тебя и спокойно ждёт, пока ты его отпустишь. Ты теряешь пять минут.");sh.clock+=5}
    else err("Ты останавливаешь невиновного. Он возмущённо жалуется администратору и уходит, хлопнув дверью.");
  }else{
    sh.charges--;
    if(c.role==='abs'){sh.absCaught=true;S.absCaught++;txt="Ты нажимаешь кнопку. Через две минуты у выхода двое в синих галстуках: «Гражданин, пройдёмте». Он идёт, не споря, ровно по прямой. Пейджер: «Цель подтверждена»."}
    else{S.innocents++;sh.innocentToday=true;ok=false;txt=A?"Пейджер: «Антон Авдеев? Проверили. Чисто. Запиши, как он выглядит». Его уводят под руки, он жуёт шаурму и смотрит в одну точку. Диск остаётся у него в куртке.":"Двое в синих галстуках уводят его. Он оборачивается и смотрит на тебя. Через час его куртка висит на спинке скамейки у фуд-корта. Пейджер: «Чисто. Бывает»."}
  }
  Snd.play(a==='pass'?(ok||neutral?'door':'buzz'):a==='stop'?(ok?'stamp':'buzz'):'pager');
  if(ok&&!neutral&&a!=='pass')setTimeout(()=>Snd.play('ding'),180);
  const cls=neutral?'':(ok?'ok':'bad');
  const head=neutral?'Он прошёл.':(ok?'Верно.':(a==='report'?'Невиновный.':'Ошибка.'));
  $('#bottom').innerHTML=`<div class="verdict ${cls}"><b>${head}</b><div>${txt}</div><button class="btn" id="next">Следующий</button></div>`;
  $('#next').focus();$('#next').onclick=()=>{sh.i++;nextCustomer()};
}

/* ---------- сцены конца смены ---------- */
function condOk(k){
  switch(k){
   case'always':return true;case'caught':return sh.absCaught;case'missed':return sh.absMissed&&sh.day>=2;
   case'errors':return sh.errors>sh.free;case'noerr':return sh.errors===0;case'innocent':return sh.innocentToday;
   case'anton_stop':return sh.antonStop;case'anton_pass':return sh.antonPass;
  }return false;
}
const VN=A.vn||{};
const VN_CHARS=Object.assign({},VN.characters||{});
const vnKey=n=>String(n||'').trim().toLowerCase();
function vnPortrait(name,emo){
  const v=Object.entries(VN_CHARS).find(([k])=>vnKey(k)===vnKey(name));
  if(!v)return null;
  const val=v[1];
  if(typeof val==='string')return val;
  if(val&&typeof val==='object')return (emo&&val[emo])||val.default||val.normal||Object.values(val)[0]||null;
  return null;
}
function vnBg(b){
  if(!b)return VN.bg||(A.ui&&A.ui.room)||IMG.STREET;
  if(A.ui&&A.ui[b])return A.ui[b];
  return b;
}
function parseLines(t){return String(t||'').split('\n').map(l=>l.trim()).filter(Boolean).map(l=>{
  const i=l.indexOf(':');
  if(!(i>0&&i<30))return {who:'',emo:'',text:l};
  let who=l.slice(0,i).trim(),emo='';
  const m=who.match(/^(.*?)\s*[\[(](.+?)[\])]$/);
  if(m){who=m[1].trim();emo=m[2].trim()}
  return {who,emo,text:l.slice(i+1).trim()};
})}
function playScenes(list,done){
  const lines=[];
  list.forEach((s,si)=>{
    const ls=parseLines(s.text);
    const left=ls.some(l=>vnKey(l.who)==='никита')?'Никита':'';
    const firstOther=(ls.find(l=>l.who&&vnKey(l.who)!=='никита')||{}).who||'';
    ls.forEach((l,i)=>lines.push({...l,first:i===0,si,bg:s.bg,left,firstOther}));
  });
  let k=0,timer=null,full='',typing=false,right='',lastSi=-1,onKey=null;
  const finish=()=>{if(onKey)document.removeEventListener('keydown',onKey);clearInterval(timer);done()};
  const slot=(side,name,emo,active,hasText)=>{
    if(!name)return `<div class="sl ${side} off"></div>`;
    const src=vnPortrait(name,emo);
    const body=src?`<img src="${esc(enc(src))}" alt="${esc(name)}" onerror="this.outerHTML='<div class=&quot;ph&quot;>${esc(name.charAt(0))}</div>'">`:`<div class="ph">${esc(name.charAt(0))}</div>`;
    return `<div class="sl ${side} ${active||!hasText?'':'dim'}">${body}</div>`;
  };
  const step=()=>{
    if(k>=lines.length)return finish();
    const ln=lines[k++];
    if(ln.first)Snd.play('pager');
    if(ln.si!==lastSi){lastSi=ln.si;right=ln.firstOther}
    const isN=vnKey(ln.who)==='никита';
    if(ln.who&&!isN)right=ln.who;
    const last=k>=lines.length;
    app.innerHTML=`<div class="screen"><div class="vn" id="vn" style="background-image:url('${esc(enc(vnBg(ln.bg)))}')">
      ${slot('l',ln.left,isN?ln.emo:'',isN,!!ln.who)}
      ${slot('r',right,(!isN&&ln.who)?ln.emo:'',!isN&&!!ln.who,!!ln.who)}
      <div class="box">${ln.who?`<div class="nm">${esc(ln.who)}</div>`:''}<div class="vt ${ln.who?'':'narr'}" id="vt"></div><div class="nx">${last?'Закончить смену ▶':'▼'}</div></div>
    </div><div class="vnhint">Клик, пробел или Enter: дальше</div></div>`;
    full=ln.text;
    const vt=$('#vt');
    let n=0;typing=true;clearInterval(timer);
    const reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion:reduce)').matches;
    if(reduce){vt.textContent=full;typing=false}
    else timer=setInterval(()=>{n++;vt.textContent=full.slice(0,n);if(n>=full.length){clearInterval(timer);typing=false}},22);
    $('#vn').onclick=advance;
  };
  const advance=()=>{
    if(typing){clearInterval(timer);typing=false;const vt=$('#vt');if(vt)vt.textContent=full;return}
    step();
  };
  onKey=e=>{if(e.key===' '||e.key==='Enter'){e.preventDefault();advance()}};
  document.addEventListener('keydown',onKey);
  step();
}

/* ---------- конец смены, вечер ---------- */
function endShift(cut){
  const d=DAYS[sh.day-1],di=sh.day-1;
  const over=Math.max(0,sh.errors-sh.free);
  const pen=over*CONFIG.penalty[di];
  const bonus=sh.absCaught?15:0;
  const incPen=sh.absMissed&&sh.day>=2?CONFIG.incident[di]:0;
  const warn=over>=CONFIG.warnOver[di];
  if(incPen){S.incidents++;S.trust--}
  if(warn)S.trust--;
  const wage=CONFIG.wage[di],rent=CONFIG.rent;
  S.money=Math.max(0,S.money+wage-pen+bonus-incPen-rent);
  Snd.ambient('off');
  const scenes=(DIALOGS||[]).filter(s=>(+s.day===0||+s.day===sh.day)&&condOk(s.cond));
  playScenes(scenes,()=>ledger(d,cut,over,pen,bonus,incPen,warn,wage,rent));
}

     <div class="ln"><span>Аренда</span><span>−${rent}</span></div>

  </div>`;
  const opts=[["heat","Включить обогреватель",10],["food","Шаурма и горячий чай",10],["mom","Позвонить маме и отправить на лекарства",15]];

    if(pick.heat)lines.push(S.cold?"В комнате тепло, хотя вчера было иначе. Ты наконец отогрелся.":"В комнате тепло, телевизор тихо шумит.");
    else{S.cold++;lines.push(S.cold===1?"Ночью комната остыла. Утром ломит виски.":S.cold===2?"Ты спал в куртке. Горло першит, пальцы плохо слушаются.":"Ты проснулся с температурой. Всё вокруг плывёт, как на ЭЛТ-мониторе.")}

}

  else if(S.momMissed>=3){t="Тверь";body=`<p>Ты не дожидаешься конца смены. Берёшь билет на ночной поезд и едешь к маме. Орлова присылает на пейджер одно слово: «Понимаю».</p><p>В вагоне ты впервые за неделю замечаешь, что тебе нечего считать, ни теней, ни времени на чеках.</p>`}
  else if(S.absCaught>=3&&S.innocents<=1){t="Чистый маршрут";body=`<p>Орлова встречает тебя у служебного входа. «Ни разу не свернул. Образцово». Она улыбается и жмёт тебе руку.</p><p>По дороге к метро ты идёшь под фонарями и замечаешь, что тень под ногами одна. Одна. Может, лампы. Может, угол. Ты не оборачиваешься, чтобы проверить.</p><p>Ты идёшь ровно, по прямой, и тебе вдруг очень спокойно.</p>`}
  else if(S.innocents>=3){t="Лишние люди";body=`<p>Орлова довольна: «Протокол соблюдён». Но ты помнишь куртки на скамейках у фуд-корта: ${S.innocents} штуки.</p><p>Ты не знаешь, кто возложит цветы на тех, кого ты назвал.</p>`}
  else if(S.absCaught<=1){t="Недосмотр";body=`<p>Абсолют не нашёл ни одного препятствия и ушёл по своему маршруту. В отчёте ВОЗР ты пока «слабое звено». Орлова не ругается: «Он просто был быстрее нас всех».</p><p>В атриуме по вечерам теперь странно тихо. Никто не помнит, когда это началось.</p>`}
  else if(S.momMissed===0&&S.cold===0&&S.hungry<=1){t="Две тени";body=`<p>Ты отказываешься продлевать договор. Орлова не спорит: «Ты слишком живой для маршрута».</p><p>Вечером в тёплой комнате ты звонишь маме. На стене горит одна лампа, и у тебя на полу две тени. Ты долго на них смотришь, а потом смеёшься, сам не зная чему.</p>`}
  else{t="Обычный охранник";body=`<p>Ты нашёл не всех, но и не перегнул. Орлова коротко кивает: «Подпишешь продление».</p><p>Идёшь домой по Невскому. Под каждым фонарём у тебя по две тени, и ты нарочно задерживаешься, чтобы посчитать.</p>`}
  app.innerHTML=`<div class="screen end">
   <div class="hero" style="background-image:url(${IMG.MEMORIAL})"><div class="in" style="min-height:300px"><div class="sub">Конец прототипа</div><h2>${t}</h2></div></div>
   <div style="max-width:640px">${body}${mom}${antonLine}</div>
   <div class="q">${quote}</div>
   <p class="small">Пойманных Абсолютов: ${S.absCaught}. Невиновных: ${S.innocents}. Пропущенных инцидентов: ${S.incidents}. Ночей без отопления: ${S.cold}.</p>
   <button class="btn" id="again">Сыграть заново</button>
  </div>`;
  $('#again').onclick=title;
}

/* ---------- запуск ---------- */
function preload(path){return new Promise(res=>{const im=new Image();im.onload=()=>res({ok:true,w:im.naturalWidth,h:im.naturalHeight});im.onerror=()=>res({ok:false});im.src=path})}
(async()=>{
  try{const m=await DB.get('mute');Snd.setMuted(!!m)}catch(e){}
  Snd.setCustom(SOUNDS);
  if(SKIPPED>0)PROBLEMS.push('Пропущено персонажей: '+SKIPPED+'. У каждого нужны file, gender ("m" или "f") и age (число).');
  const jobs=[];
  if(ART.bg)jobs.push(preload(ART.bg).then(r=>{if(!r.ok){PROBLEMS.push('Не найден фон: '+A.background);ART.bg=null}}));
  if(ART.view)jobs.push(preload(ART.view).then(r=>{if(!r.ok){PROBLEMS.push('Не найден стол: '+A.desk);ART.view=null}else if(!ART.viewRatio)ART.viewRatio=+(r.w/r.h).toFixed(3)}));
  if(ANTON)jobs.push(preload(enc(ANTON.file)).then(r=>{if(!r.ok){PROBLEMS.push('Не найден Антон: '+ANTON.file);ANTON=null}}));
  NPCS.slice().forEach(n=>jobs.push(preload(enc(n.file)).then(r=>{if(!r.ok){PROBLEMS.push('Не найден персонаж: '+n.file);const k=NPCS.indexOf(n);if(k>=0)NPCS.splice(k,1)}})));
  await Promise.all(jobs);
  title();
})();
</script>
